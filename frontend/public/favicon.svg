<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#grad)"/>
  
  <!-- Headset -->
  <g fill="white">
    <!-- Left earpiece -->
    <ellipse cx="28" cy="45" rx="8" ry="12"/>
    <!-- Right earpiece -->
    <ellipse cx="72" cy="45" rx="8" ry="12"/>
    <!-- Headband -->
    <path d="M 28 35 Q 50 20, 72 35" stroke="white" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- Microphone arm -->
    <path d="M 72 50 Q 75 60, 70 70" stroke="white" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- Microphone -->
    <circle cx="68" cy="73" r="6"/>
  </g>
  
  <!-- Small phone icon -->
  <g fill="white" opacity="0.9">
    <rect x="42" y="60" width="16" height="24" rx="3"/>
    <rect x="47" y="79" width="6" height="2" rx="1"/>
  </g>
</svg>
